# Stopmoergel on a VPS. See docs/DEPLOY.md.
#
# A) The server already has a reverse proxy (nginx, Traefik, …): start only the app (default),
#    then proxy your domain to 127.0.0.1:${APP_PORT}:
#      docker compose up -d --build
#
# B) Nothing on ports 80/443 yet: also start Caddy, which does HTTPS automatically:
#      docker compose --profile caddy up -d --build
services:
  app:
    build: .
    image: stopmoergel:latest
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      # Only reachable from the server itself (for an existing proxy); Caddy talks to it over the compose network.
      - "127.0.0.1:${APP_PORT:-8080}:8080"

  caddy:
    image: caddy:2.10-alpine
    # Opt-in: would otherwise clash with an existing proxy on ports 80/443.
    profiles: ["caddy"]
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates — keep this volume!
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
