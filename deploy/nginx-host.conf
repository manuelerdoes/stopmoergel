# Host nginx config for Stopmoergel (the app container runs on 127.0.0.1:8910).
# Install:  sudo cp deploy/nginx-host.conf /etc/nginx/sites-available/stopmoergel.bitesnbytes.ch
#           sudo ln -s /etc/nginx/sites-available/stopmoergel.bitesnbytes.ch /etc/nginx/sites-enabled/
# Full steps (incl. getting the certificate first): docs/DEPLOY.md, "Option A".

# ---- HTTP: Let's Encrypt challenges + redirect everything else to HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name stopmoergel.bitesnbytes.ch;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS: camera + microphone only work on a secure origin ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;   # nginx < 1.25.1: remove this line and write "listen 443 ssl http2;" instead
    server_name stopmoergel.bitesnbytes.ch;

    ssl_certificate     /etc/letsencrypt/live/stopmoergel.bitesnbytes.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stopmoergel.bitesnbytes.ch/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:stopmo_ssl:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # The app is static; requests are tiny (movies never leave the browser).
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8910;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The app container already sends CSP, Permissions-Policy (camera/mic) and caching headers.
        # Don't override them here.
    }
}
