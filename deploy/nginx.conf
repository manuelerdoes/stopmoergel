# Static file server for the Stopmoergel single-page app (no backend; all data stays in the browser).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Movies never reach the server, but backups / music are handled client-side only — keep requests small.
    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ---- Security headers (repeated in every location that sets its own headers) ----
    # Camera + microphone only for this site. AudioWorklet is loaded from a blob: URL, hence script-src blob:.
    # React sets inline style attributes, hence style-src 'unsafe-inline'.
    set $csp "default-src 'self'; script-src 'self' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' blob: data:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'";

    add_header Content-Security-Policy $csp always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite puts content-hashed files here: safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy $csp always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        try_files $uri =404;
    }

    # index.html must always be revalidated so new deployments show up immediately.
    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        # Hash routing (#/movie/…) means every real path is a file; unknown paths fall back to the app.
        try_files $uri $uri/ /index.html;
    }
}
